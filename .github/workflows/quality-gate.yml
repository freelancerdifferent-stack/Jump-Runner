name: Quality Gate and APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "started=$(date -u +%FT%TZ)"
          } > ci-diagnostics/latest.log

      - name: Validate game JavaScript
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee -a ci-diagnostics/latest.log
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text()
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S)
          if not blocks:
              raise SystemExit('ERROR: no inline game script found')
          Path('/tmp/jumprunner.js').write_text('\n'.join(blocks))
          print(f'HTML bytes={len(html)} script_blocks={len(blocks)}')
          PY
          node --check /tmp/jumprunner.js 2>&1 | tee -a ci-diagnostics/latest.log

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee -a ci-diagnostics/latest.log

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug 2>&1 | tee -a ci-diagnostics/latest.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee -a ci-diagnostics/latest.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          stat -c 'apk_bytes=%s' app/build/outputs/apk/debug/app-debug.apk | tee -a ci-diagnostics/latest.log

      - name: Final diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "finished=$(date -u +%FT%TZ)"
            if [ -s app/build/outputs/apk/debug/app-debug.apk ]; then echo 'apk=present'; else echo 'apk=missing'; fi
          } >> ci-diagnostics/latest.log
          tail -n 120 ci-diagnostics/latest.log > ci-diagnostics/summary.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: ci-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: JumpRunner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
