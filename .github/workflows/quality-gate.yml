name: Quality Gate and APK

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize diagnostics
        shell: bash
        run: |
          mkdir -p ci-diagnostics
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "event=${GITHUB_EVENT_NAME}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "started=$(date -u +%FT%TZ)"
          } > ci-diagnostics/latest.log

      - name: Game source invariant checks
        shell: bash
        run: |
          set -o pipefail
          python3 tools/check_game_source.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_boss_accessibility.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_onboarding_accessibility.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_onboarding_completion.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_guide_completion_feedback.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_guide_boss_hud_clearance.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_boss_arena_feedback.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_audio_lifecycle.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_reduced_motion.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_checkpoint_recovery.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_boss_checkpoint_recovery.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_contract_storage.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_resume_countdown.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_boss_victory_grace.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_boss_hit_recovery.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_mobile_input_resilience.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_manual_pause_control.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_boss_hit_confirmation.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_boss_dash_button_cue.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_clear_streak_progress.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_flawless_clear_progress.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_clean_sweep_progress.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_perfect_trial_progress.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_perfect_trial_streak.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_sentinel_arena_momentum.py 2>&1 | tee -a ci-diagnostics/latest.log
          python3 tools/check_boss_defeat_followthrough.py 2>&1 | tee -a ci-diagnostics/latest.log

      - name: Validate packaged game JavaScript
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee -a ci-diagnostics/latest.log
          from pathlib import Path
          import re
          assets=Path('app/src/main/assets')
          html=(assets/'index.html').read_text()
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I)
          if not scripts:
              raise SystemExit('ERROR: no packaged game script found')
          for script in scripts:
              path=assets/script
              if not path.is_file():
                  raise SystemExit(f'ERROR: missing script {script}')
              print(f'javascript={script} bytes={path.stat().st_size}')
          print(f'javascript_files={len(scripts)}')
          PY
          while IFS= read -r js; do
            node --check "$js" 2>&1 | tee -a ci-diagnostics/latest.log
          done < <(find app/src/main/assets -maxdepth 1 -type f -name '*.js' -print | sort)

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 2>&1 | tee -a ci-diagnostics/latest.log

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:lintDebug 2>&1 | tee -a ci-diagnostics/latest.log

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee -a ci-diagnostics/latest.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          stat -c 'apk_bytes=%s' app/build/outputs/apk/debug/app-debug.apk | tee -a ci-diagnostics/latest.log

      - name: Final diagnostic summary
        if: always()
        shell: bash
        run: |
          {
            echo "finished=$(date -u +%FT%TZ)"
            if [ -s app/build/outputs/apk/debug/app-debug.apk ]; then echo 'apk=present'; else echo 'apk=missing'; fi
          } >> ci-diagnostics/latest.log
          tail -n 120 ci-diagnostics/latest.log > ci-diagnostics/summary.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: ci-diagnostics/
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v4
        with:
          name: JumpRunner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish main build status
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -s app/build/outputs/apk/debug/app-debug.apk ]; then APK_STATE=present; else APK_STATE=missing; fi
          BODY=$(printf 'run_id=%s\nsha=%s\nstatus=%s\napk=%s\nrun_url=https://github.com/%s/actions/runs/%s' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$JOB_STATUS" "$APK_STATE" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body "$BODY"
