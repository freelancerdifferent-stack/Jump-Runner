<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jump Runner</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050914;color:white;font-family:system-ui,sans-serif;touch-action:none}*{box-sizing:border-box}canvas{width:100%;height:100%;display:block}.hud{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));font-weight:800;letter-spacing:.08em;text-shadow:0 2px 8px #000}.tag{opacity:.65;font-size:11px}.title{font-size:18px}.hint{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));font-size:12px;opacity:.7}.pause{position:fixed;inset:0;display:none;place-items:center;background:#050914cc;font-size:32px;font-weight:900}.pause.show{display:grid}
</style>
</head>
<body>
<canvas id="game" aria-label="Jump Runner game canvas"></canvas>
<div class="hud"><div class="tag">JUMP RUNNER · FOUNDATION</div><div class="title" id="score">000000</div></div>
<div class="hint">TAP / SPACE · JUMP</div>
<div id="pause" class="pause">PAUSED</div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),pauseEl=document.getElementById('pause');
let W=0,H=0,last=0,paused=false,score=0;
const player={x:120,y:0,vy:0,r:22,onGround:false};
function resize(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*d);canvas.height=Math.floor(H*d);ctx.setTransform(d,0,0,d,0,0)}
function jump(){if(paused)return;if(player.onGround){player.vy=-650;player.onGround=false}}
addEventListener('resize',resize);addEventListener('pointerdown',jump);addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});
addEventListener('jumprunnerpause',()=>{paused=true;pauseEl.classList.add('show')});addEventListener('jumprunnerresume',()=>{paused=false;last=performance.now();pauseEl.classList.remove('show')});
function update(dt){const floor=H-74;player.vy+=1800*dt;player.y+=player.vy*dt;if(player.y+player.r>=floor){player.y=floor-player.r;player.vy=0;player.onGround=true}score+=dt*100;scoreEl.textContent=String(Math.floor(score)).padStart(6,'0')}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#152e58');g.addColorStop(1,'#07101f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffffff12';for(let i=0;i<18;i++){const x=((i*173-score*.7)%(W+180))-90;ctx.fillRect(x,H-145-(i%3)*32,100,3)}ctx.fillStyle='#17263e';ctx.fillRect(0,H-74,W,74);ctx.fillStyle='#65e6ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(player.x+7,player.y-5,4,0,Math.PI*2);ctx.fill()}
function frame(t){requestAnimationFrame(frame);if(paused)return;const dt=Math.min((t-last)/1000||0,.033);last=t;update(dt);draw()}
resize();player.y=innerHeight-120;requestAnimationFrame(frame);
</script>
</body>
</html>
