<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jump Runner</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="game" aria-label="Jump Runner game canvas"></canvas>
<div class="hud"><div><div class="brand">JUMP RUNNER · SKYLINE TRIAL</div><div class="score" id="score">000000</div></div><div class="stats"><div class="pill">INTEGRITY<b id="health">◆◆◆</b></div><div class="pill">CRYSTALS<b id="crystals">0 / 0</b></div><div class="pill">FLOW<b id="flow">x1</b></div></div></div>
<div class="progress"><i id="progressBar"></i></div>
<div class="controls"><button class="control" id="jumpBtn" aria-label="Jump">JUMP</button><button class="control dash" id="dashBtn" aria-label="Dash">DASH</button></div>
<div id="overlay" class="overlay"><div class="panel" id="panel"></div></div>
<div id="pause" class="pause">PAUSED</div><div id="flash" class="flash"></div>
<script src="game.js"></script>
<script src="checkpoints.js"></script>
<script src="health.js"></script>
<script src="biomes.js"></script>
<script src="boss.js"></script>
<script src="audio.js"></script>
<script src="mastery.js"></script>
<script src="contracts.js"></script>
<script src="accessibility.js"></script>
<script src="onboarding.js"></script>
<script src="native.js"></script>
<script src="telemetry.js"></script>
<script src="run-history.js"></script>
<script src="performance.js"></script>
</body>
</html>
