<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jump Runner</title>
<style>
:root{--glass:#071325c9;--cyan:#69edff;--gold:#ffd86b;--red:#ff5f79}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040813;color:#fff;font-family:Inter,system-ui,-apple-system,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}*{box-sizing:border-box}canvas{width:100%;height:100%;display:block}.hud{position:fixed;z-index:5;left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.brand{font-size:10px;font-weight:900;letter-spacing:.18em;opacity:.72}.score{font-size:25px;font-weight:950;letter-spacing:.04em}.stats{display:flex;gap:8px}.pill{min-width:76px;padding:8px 11px;border:1px solid #ffffff18;border-radius:13px;background:var(--glass);backdrop-filter:blur(8px);font-size:11px;font-weight:850;text-align:center;box-shadow:0 8px 28px #0005}.pill b{display:block;font-size:15px;color:var(--cyan)}.progress{position:fixed;z-index:5;left:18%;right:18%;top:max(15px,env(safe-area-inset-top));height:5px;border-radius:8px;background:#ffffff16;overflow:hidden;pointer-events:none}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));box-shadow:0 0 12px var(--cyan)}.controls{position:fixed;z-index:6;inset:auto max(16px,env(safe-area-inset-right)) max(15px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;justify-content:space-between;align-items:end;pointer-events:none}.control{width:82px;height:82px;border-radius:50%;border:1px solid #ffffff24;background:#071325b8;color:#fff;font-weight:950;font-size:12px;letter-spacing:.08em;pointer-events:auto;display:grid;place-items:center;box-shadow:0 12px 30px #0007,inset 0 0 26px #65e6ff0c;-webkit-tap-highlight-color:transparent}.control:active{transform:scale(.94);background:#16334acc}.control.dash{border-color:#ffd86b4a;color:var(--gold)}.overlay{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 35%,#132c4fcc,#040813f4 64%);transition:.18s opacity}.overlay.hidden{opacity:0;pointer-events:none}.panel{width:min(560px,92vw);padding:28px;border:1px solid #ffffff1a;border-radius:28px;background:#07101eea;box-shadow:0 28px 90px #000a;text-align:center}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.24em;color:var(--cyan)}h1{margin:8px 0 4px;font-size:clamp(36px,7vw,64px);line-height:.9;letter-spacing:-.055em}h1 em{font-style:normal;color:var(--gold)}.sub{margin:12px auto 20px;max-width:430px;color:#c6d7e8;font-size:13px;line-height:1.55}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:15px;padding:13px 22px;font-weight:950;letter-spacing:.08em;background:linear-gradient(135deg,var(--cyan),#8ca8ff);color:#06111b;box-shadow:0 10px 26px #4ddfff33}.btn.alt{background:#ffffff0d;color:#fff;border:1px solid #ffffff18;box-shadow:none}.legend{display:flex;justify-content:center;gap:18px;margin-top:18px;font-size:10px;font-weight:800;letter-spacing:.07em;color:#9bb1c7}.pause{position:fixed;z-index:9;inset:0;display:none;place-items:center;background:#040813d9;font-size:30px;font-weight:950;letter-spacing:.12em}.pause.show{display:grid}.flash{position:fixed;z-index:8;inset:0;pointer-events:none;background:#fff;opacity:0}.flash.on{animation:blink .18s ease-out}@keyframes blink{0%{opacity:.28}100%{opacity:0}}@media(max-height:430px){.control{width:68px;height:68px}.panel{padding:20px}.sub{margin:8px auto 12px}.legend{margin-top:10px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Jump Runner game canvas"></canvas>
<div class="hud"><div><div class="brand">JUMP RUNNER · SKYLINE TRIAL</div><div class="score" id="score">000000</div></div><div class="stats"><div class="pill">CRYSTALS<b id="crystals">0 / 0</b></div><div class="pill">FLOW<b id="flow">x1</b></div></div></div>
<div class="progress"><i id="progressBar"></i></div>
<div class="controls"><button class="control" id="jumpBtn" aria-label="Jump">JUMP</button><button class="control dash" id="dashBtn" aria-label="Dash">DASH</button></div>
<div id="overlay" class="overlay"><div class="panel" id="panel"></div></div>
<div id="pause" class="pause">PAUSED</div><div id="flash" class="flash"></div>
<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score'),crystalEl=document.getElementById('crystals'),flowEl=document.getElementById('flow'),progressEl=document.getElementById('progressBar');
const overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),pauseEl=document.getElementById('pause'),flash=document.getElementById('flash');
const VW=960,VH=540,GROUND=456,LEVEL_END=7900,GRAVITY=2300,JUMP_V=-820;
let scale=1,ox=0,oy=0,last=0,state='menu',paused=false,time=0,score=0,crystals=0,totalCrystals=0,flow=1,flowTimer=0,shake=0,cam=0,deathReason='',best=Number(localStorage.getItem('jr_best')||0),bestTime=Number(localStorage.getItem('jr_time')||0);
let particles=[],collected=new Set(),broken=new Set();
const player={x:150,y:GROUND-52,w:38,h:52,vy:0,onGround:true,coyote:0,jumpBuffer:0,jumpHeld:false,dash:0,dashCd:0,inv:0,land:0,trail:[]};
const platforms=[
{x:0,y:GROUND,w:1080,h:90},{x:1180,y:GROUND,w:850,h:90},{x:2130,y:GROUND,w:1060,h:90},{x:3310,y:GROUND,w:760,h:90},{x:4200,y:GROUND,w:1180,h:90},{x:5510,y:GROUND,w:780,h:90},{x:6420,y:GROUND,w:1650,h:90},
{x:620,y:350,w:210,h:22},{x:1450,y:336,w:220,h:22},{x:1760,y:290,w:170,h:22},{x:2440,y:342,w:240,h:22},{x:2820,y:284,w:190,h:22},{x:3490,y:340,w:200,h:22},{x:3810,y:292,w:170,h:22},{x:4540,y:345,w:250,h:22},{x:4890,y:285,w:190,h:22},{x:5720,y:332,w:210,h:22},{x:6120,y:274,w:180,h:22},{x:6810,y:338,w:220,h:22},{x:7240,y:282,w:190,h:22}
];
const spikes=[{x:890,y:GROUND-30,w:60,h:30},{x:1510,y:GROUND-30,w:72,h:30},{x:2645,y:GROUND-30,w:65,h:30},{x:3570,y:GROUND-30,w:66,h:30},{x:4650,y:GROUND-30,w:82,h:30},{x:5870,y:GROUND-30,w:68,h:30},{x:6920,y:GROUND-30,w:74,h:30},{x:7480,y:GROUND-30,w:82,h:30}];
const barriers=[{x:1020,y:GROUND-74,w:34,h:74},{x:1945,y:GROUND-86,w:38,h:86},{x:3150,y:GROUND-80,w:36,h:80},{x:4050,y:GROUND-92,w:38,h:92},{x:5350,y:GROUND-84,w:38,h:84},{x:6280,y:GROUND-96,w:40,h:96},{x:7140,y:GROUND-86,w:38,h:86}];
const crystalPoints=[
[420,385],[690,300],[770,300],[1250,390],[1510,286],[1600,286],[1820,240],[2200,380],[2480,292],[2580,292],[2870,234],[3000,380],[3400,390],[3540,290],[3860,242],[3980,242],[4320,385],[4580,295],[4700,295],[4930,235],[5100,385],[5570,385],[5760,282],[6200,224],[6480,385],[6840,288],[6960,288],[7270,232],[7420,385],[7730,360]
];
const crystalsWorld=crystalPoints.map((p,i)=>({id:i,x:p[0],y:p[1],r:9}));totalCrystals=crystalsWorld.length;
function resize(){const d=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(d,0,0,d,0,0);scale=Math.min(w/VW,h/VH);ox=(w-VW*scale)/2;oy=(h-VH*scale)/2}
function toGame(){ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale)}function fromGame(){ctx.restore()}
function rects(a,b){return a.x<a.x+b.w&&false}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function burst(x,y,color,n=12,power=180){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=.25+Math.random()*.75;particles.push({x,y,vx:Math.cos(a)*power*s,vy:Math.sin(a)*power*s-70,life:.35+Math.random()*.35,max:.7,r:2+Math.random()*3,color})}if(particles.length>180)particles.splice(0,particles.length-180)}
function resetRun(){state='play';time=score=crystals=0;flow=1;flowTimer=0;shake=0;cam=0;deathReason='';particles=[];collected.clear();broken.clear();Object.assign(player,{x:150,y:GROUND-52,vy:0,onGround:true,coyote:.1,jumpBuffer:0,jumpHeld:false,dash:0,dashCd:0,inv:0,land:0,trail:[]});overlay.classList.add('hidden');updateHud();last=performance.now()}
function showMenu(){state='menu';overlay.classList.remove('hidden');panel.innerHTML=`<div class="eyebrow">PRECISION ARCADE RUNNER</div><h1>JUMP <em>RUNNER</em></h1><div class="sub">Cross the Skyline Trial. Time jumps over spikes and gaps, smash energy barriers with Dash, collect crystals and keep your Flow alive.</div><div class="actions"><button class="btn" id="start">START RUN</button></div><div class="legend"><span>JUMP · tap / SPACE</span><span>DASH · right button / X</span></div>${best?`<div class="legend"><span>BEST ${String(best).padStart(6,'0')}</span>${bestTime?`<span>FASTEST ${bestTime.toFixed(1)}s</span>`:''}</div>`:''}`;document.getElementById('start').onclick=resetRun}
function showResult(win){state=win?'win':'dead';overlay.classList.remove('hidden');const rank=win?(crystals>=26&&time<34?'S':crystals>=22?'A':crystals>=16?'B':'C'):'—';if(win){score+=Math.max(0,Math.floor((45-time)*140))+crystals*180;best=Math.max(best,Math.floor(score));localStorage.setItem('jr_best',best);if(!bestTime||time<bestTime){bestTime=time;localStorage.setItem('jr_time',bestTime)}}panel.innerHTML=`<div class="eyebrow">${win?'TRIAL COMPLETE':'RUN INTERRUPTED'}</div><h1>${win?`RANK <em>${rank}</em>`:'TRY AGAIN'}</h1><div class="sub">${win?`${time.toFixed(1)} seconds · ${crystals}/${totalCrystals} crystals · score ${Math.floor(score)}`:deathReason}</div><div class="actions"><button class="btn" id="retry">${win?'RUN AGAIN':'RETRY'}</button><button class="btn alt" id="home">HOME</button></div>`;document.getElementById('retry').onclick=resetRun;document.getElementById('home').onclick=showMenu;updateHud()}
function inputJump(down){if(state==='menu'||state==='dead'||state==='win')return;if(down){player.jumpHeld=true;player.jumpBuffer=.13}else{player.jumpHeld=false;if(player.vy<-250)player.vy*=.52}}
function inputDash(){if(state!=='play'||player.dashCd>0)return;player.dash=.18;player.dashCd=.72;shake=Math.max(shake,4);burst(player.x+player.w,player.y+player.h*.55,'#ffd86b',10,130)}
function jumpBtnDown(e){e.preventDefault();inputJump(true)}function jumpBtnUp(e){e.preventDefault();inputJump(false)}
const jb=document.getElementById('jumpBtn'),db=document.getElementById('dashBtn');jb.addEventListener('pointerdown',jumpBtnDown);jb.addEventListener('pointerup',jumpBtnUp);jb.addEventListener('pointercancel',jumpBtnUp);db.addEventListener('pointerdown',e=>{e.preventDefault();inputDash()});
addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='ArrowUp')&&!e.repeat){e.preventDefault();inputJump(true)}if((e.code==='KeyX'||e.code==='ShiftLeft')&&!e.repeat){e.preventDefault();inputDash()}if(e.code==='Enter'&&(state==='menu'||state==='dead'||state==='win'))resetRun()});addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='ArrowUp')inputJump(false)});addEventListener('resize',resize);
addEventListener('jumprunnerpause',()=>{paused=true;pauseEl.classList.add('show')});addEventListener('jumprunnerresume',()=>{paused=false;last=performance.now();pauseEl.classList.remove('show')});
function kill(reason){if(state!=='play'||player.inv>0)return;deathReason=reason;state='dying';player.inv=.5;shake=18;flash.classList.remove('on');void flash.offsetWidth;flash.classList.add('on');burst(player.x+player.w/2,player.y+player.h/2,'#ff5f79',28,260);setTimeout(()=>showResult(false),380)}
function surfaceAt(px,feet,prevFeet){let hit=null;for(const p of platforms){if(px+player.w*.72<p.x||px+player.w*.28>p.x+p.w)continue;if(player.vy>=0&&prevFeet<=p.y+4&&feet>=p.y&&feet<=p.y+30){if(!hit||p.y<hit.y)hit=p}}return hit}
function update(dt){if(state!=='play'&&state!=='dying'){updateParticles(dt);return}if(state==='dying'){updateParticles(dt);return}time+=dt;player.coyote=Math.max(0,player.coyote-dt);player.jumpBuffer=Math.max(0,player.jumpBuffer-dt);player.dash=Math.max(0,player.dash-dt);player.dashCd=Math.max(0,player.dashCd-dt);player.inv=Math.max(0,player.inv-dt);player.land=Math.max(0,player.land-dt);flowTimer=Math.max(0,flowTimer-dt);if(flowTimer<=0)flow=1;
const speed=340+Math.min(115,time*3.2)+(player.dash>0?320:0);player.x+=speed*dt;const prevY=player.y,prevFeet=prevY+player.h;player.vy+=GRAVITY*dt;player.y+=player.vy*dt;const feet=player.y+player.h,surf=surfaceAt(player.x,feet,prevFeet);if(surf){if(!player.onGround&&player.vy>300){player.land=.12;burst(player.x+player.w/2,surf.y,'#9eefff',8,80)}player.y=surf.y-player.h;player.vy=0;player.onGround=true;player.coyote=.11}else{if(player.onGround)player.coyote=.11;player.onGround=false}
if(player.jumpBuffer>0&&player.coyote>0){player.vy=JUMP_V;player.onGround=false;player.coyote=0;player.jumpBuffer=0;burst(player.x+player.w*.4,player.y+player.h,'#69edff',9,95)}if(!player.jumpHeld&&player.vy<-260)player.vy+=1500*dt;
const pr={x:player.x+6,y:player.y+5,w:player.w-12,h:player.h-7};for(const s of spikes){if(overlap(pr,s)){kill('Spikes broke your Flow. Jump a fraction earlier.');break}}for(let i=0;i<barriers.length;i++){if(broken.has(i))continue;const b=barriers[i];if(overlap(pr,b)){if(player.dash>0){broken.add(i);score+=650;flow=Math.min(8,flow+1);flowTimer=2.4;shake=10;burst(b.x+b.w/2,b.y+b.h/2,'#ffd86b',25,250)}else{kill('Energy barriers can only be broken while Dashing.');break}}}
for(const c of crystalsWorld){if(collected.has(c.id))continue;const dx=player.x+player.w/2-c.x,dy=player.y+player.h/2-c.y;if(dx*dx+dy*dy<900){collected.add(c.id);crystals++;flow=Math.min(8,flow+1);flowTimer=2.8;score+=120*flow;burst(c.x,c.y,'#69edff',9,100)}}
if(player.y>VH+90)kill('You fell below the skyline. Watch the gaps and platform edges.');score+=dt*(85+flow*12);if(player.x>=LEVEL_END)showResult(true);cam+=(Math.max(0,player.x-210)-cam)*Math.min(1,dt*6.5);player.trail.unshift({x:player.x,y:player.y,life:.18});player.trail=player.trail.slice(0,8);for(const t of player.trail)t.life-=dt;updateParticles(dt);updateHud()}
function updateParticles(dt){for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=480*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}
function updateHud(){scoreEl.textContent=String(Math.max(0,Math.floor(score))).padStart(6,'0');crystalEl.textContent=`${crystals} / ${totalCrystals}`;flowEl.textContent='x'+flow;progressEl.style.width=Math.min(100,player.x/LEVEL_END*100)+'%'}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#0d1f3f');g.addColorStop(.56,'#173f63');g.addColorStop(1,'#08111e');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);const sunX=760-cam*.025;ctx.fillStyle='#ffd87822';ctx.beginPath();ctx.arc(sunX,116,78,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd87855';ctx.beginPath();ctx.arc(sunX,116,39,0,Math.PI*2);ctx.fill();for(let layer=0;layer<3;layer++){ctx.fillStyle=['#0d1b2d','#10243a','#15324b'][layer];const par=.08+layer*.07;for(let i=0;i<14;i++){const x=i*180-(cam*par%180)-90,w=70+(i%4)*25,h=50+((i*41)%110)+layer*35;ctx.fillRect(x,VH-74-h,w,h);ctx.fillStyle='#6de8ff0b';for(let k=0;k<3;k++)ctx.fillRect(x+12+k*18,VH-62-h,8,14);ctx.fillStyle=['#0d1b2d','#10243a','#15324b'][layer]}}}
function drawWorld(){ctx.save();ctx.translate(-cam,0);for(const p of platforms){ctx.fillStyle=p.y===GROUND?'#142942':'#1b3953';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#69edff2e';ctx.fillRect(p.x,p.y,p.w,4);if(p.y!==GROUND){ctx.fillStyle='#ffffff09';ctx.fillRect(p.x+12,p.y+8,p.w-24,3)}}for(const s of spikes){ctx.fillStyle='#ff5f79';const n=Math.max(1,Math.round(s.w/20));for(let i=0;i<n;i++){const x=s.x+i*s.w/n;ctx.beginPath();ctx.moveTo(x,s.y+s.h);ctx.lineTo(x+s.w/n/2,s.y);ctx.lineTo(x+s.w/n,s.y+s.h);ctx.fill()}}for(let i=0;i<barriers.length;i++){if(broken.has(i))continue;const b=barriers[i];ctx.shadowBlur=16;ctx.shadowColor='#ffd86b';ctx.fillStyle='#ffd86b';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#fff5';for(let y=b.y+8;y<b.y+b.h;y+=17)ctx.fillRect(b.x+5,y,b.w-10,3);ctx.shadowBlur=0}for(const c of crystalsWorld){if(collected.has(c.id))continue;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(time*2+c.id);ctx.shadowBlur=15;ctx.shadowColor='#69edff';ctx.fillStyle='#69edff';ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(8,0);ctx.lineTo(0,11);ctx.lineTo(-8,0);ctx.closePath();ctx.fill();ctx.restore()}ctx.fillStyle='#ffd86b';ctx.fillRect(LEVEL_END,270,6,186);ctx.fillStyle='#fff';ctx.font='900 13px system-ui';ctx.fillText('FINISH',LEVEL_END-22,255);for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;drawPlayer();ctx.restore()}
function drawPlayer(){for(let i=player.trail.length-1;i>=0;i--){const t=player.trail[i];if(t.life<=0)continue;ctx.globalAlpha=t.life*.6;ctx.fillStyle=player.dash>0?'#ffd86b':'#69edff';ctx.fillRect(t.x+8,t.y+9,player.w-16,player.h-18)}ctx.globalAlpha=1;const squash=player.land>0?.84:1,stretch=!player.onGround?1.08:1;ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h);ctx.scale(1/squash,squash*stretch);ctx.translate(-player.w/2,-player.h);ctx.rotate(player.dash>0?.14:0);ctx.shadowBlur=player.dash>0?25:14;ctx.shadowColor=player.dash>0?'#ffd86b':'#69edff';ctx.fillStyle=player.dash>0?'#ffd86b':'#69edff';rr(2,3,34,46,12);ctx.shadowBlur=0;ctx.fillStyle='#071325';rr(9,16,23,18,8);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(26,22,3.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff5f79';ctx.fillRect(-7,10,14,5);ctx.fillRect(-14,13,13,4);ctx.restore()}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);toGame();const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;ctx.translate(sx,sy);shake*=.86;drawSky();drawWorld();ctx.fillStyle='#02071188';ctx.fillRect(0,VH-28,VW,28);if(state==='play'){ctx.fillStyle='#ffffff6b';ctx.font='700 11px system-ui';ctx.fillText(`SPEED ${Math.round(340+Math.min(115,time*3.2))}`,16,VH-10);if(player.dashCd>0){ctx.fillStyle='#ffd86b55';ctx.fillRect(VW-150,VH-17,120*(1-player.dashCd/.72),4)}}fromGame()}
function frame(t){requestAnimationFrame(frame);if(paused)return;const dt=Math.min(.033,Math.max(0,(t-last)/1000||0));last=t;update(dt);draw()}
resize();showMenu();requestAnimationFrame(frame);
</script>
</body>
</html>
